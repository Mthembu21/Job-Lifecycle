<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#415464" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Lifecycle Management</title>
    <script>
      // Apply the saved theme before first paint to avoid a light flash in dark mode.
      try {
        if (localStorage.getItem("job-lifecycle.theme-mode") === "dark") document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
